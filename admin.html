<!DOCTYPE html>
<html lang="ko">
<head>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.update()));
      }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLC DG 관리자</title>
    <!-- 파비콘을 파일로 두지 않고 인라인으로. 없으면 브라우저가 /favicon.ico 를
         찾다가 404 를 콘솔에 남긴다. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e293b'/%3E%3Ctext x='16' y='22' font-size='16' font-weight='700' text-anchor='middle' fill='%23e2e8f0' font-family='sans-serif'%3EDG%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css?v=88">
    <link rel="stylesheet" href="admin.css?v=88">
</head>
<body class="dark-mode">
    <div class="admin-container">
        <!-- 헤더 -->
        <header class="admin-header">
            <div class="admin-header-content">
                <div class="admin-brand">
                    <div class="admin-logo">PLC</div>
                    <span class="admin-badge">관리자 모드</span>
                </div>
                <div class="admin-controls">
                    <div class="theme-toggle-wrapper">
                        <svg class="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <button class="theme-toggle" id="themeToggle" aria-label="테마 전환">
                            <div class="toggle-track">
                                <div class="toggle-thumb"></div>
                            </div>
                        </button>
                    </div>
                    <button class="logout-btn" id="logoutBtn" aria-label="로그아웃" title="로그아웃">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        <span class="logout-text">로그아웃</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- 시트 동기화 -->
        <div class="sync-bar">
            <button type="button" id="syncBtn" class="sync-btn">⟳ 시트에서 지금 가져오기</button>
            <button type="button" id="syncReloadBtn" class="sync-btn ghost">화면 새로 고침</button>
            <span id="syncInfo" class="sync-info">시트를 고쳤으면 여기서 가져오세요. 보통 1~2분 걸립니다.</span>
        </div>

        <!-- 탭 네비게이션 -->
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="search">검색 모드</button>
            <button class="tab-btn" data-tab="teams">조별 보기</button>
            <button class="tab-btn" data-tab="members">개인별 보기</button>
            <button class="tab-btn" data-tab="attendance">출석 관리</button>
            <button class="tab-btn" data-tab="absence">결석 현황</button>
            <button class="tab-btn" data-tab="print">출석부 출력</button>
        </nav>

        <!-- 검색 모드 -->
        <div class="tab-content active" id="searchTab">
            <div class="search-section">
                <div class="search-box">
                    <div class="input-group">
                        <label for="searchName">이름</label>
                        <input 
                            type="text" 
                            id="searchName" 
                            placeholder="이름을 입력하세요"
                            autocomplete="off"
                        >
                    </div>
                    <button class="search-btn" id="adminSearchBtn">
                        <span class="btn-text">검색하기</span>
                    </button>
                </div>

                <!-- 동명이인 선택 -->
                <div class="duplicate-container" id="duplicateContainer" style="display: none;">
                    <h3 class="duplicate-title">동일한 이름이 여러 명 있습니다. 선택해주세요:</h3>
                    <div class="duplicate-list" id="duplicateList"></div>
                </div>

                <!-- 검색 결과 -->
                <div class="result-container" id="searchResultContainer" style="display: none;">
                    <div class="result-card">
                        <div class="result-header">
                            <h2 class="result-title">조원 정보</h2>
                            <button class="close-btn" id="searchCloseBtn">✕</button>
                        </div>
                        <div class="result-content">
                            <div class="info-row">
                                <span class="info-label">이름</span>
                                <span class="info-value" id="searchResultName">-</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">조</span>
                                <span class="info-value highlight" id="searchResultTeam">-</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">위치</span>
                                <span class="info-value" id="searchResultLocation">-</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 에러 메시지 -->
                <div class="error-message" id="searchErrorMessage" style="display: none;">
                    <span class="error-icon">⚠</span>
                    <span class="error-text" id="searchErrorText"></span>
                </div>
            </div>
        </div>

        <!-- 조별 보기 -->
        <div class="tab-content" id="teamsTab">
            <div class="filter-section">
                <input 
                    type="text" 
                    id="teamFilter" 
                    class="filter-input" 
                    placeholder="조 이름 또는 위치로 검색..."
                    autocomplete="off"
                >
            </div>
            <div class="teams-grid" id="teamsGrid">
                <!-- 조별 카드들이 여기에 동적으로 생성됩니다 -->
            </div>
        </div>

        <!-- 개인별 보기 -->
        <div class="tab-content" id="membersTab">
            <div class="filter-section">
                <input 
                    type="text" 
                    id="memberFilter" 
                    class="filter-input" 
                    placeholder="이름, 조, 위치로 검색..."
                    autocomplete="off"
                >
            </div>
            <div class="members-grid" id="membersGrid">
                <!-- 개인 카드들이 여기에 동적으로 생성됩니다 -->
            </div>
        </div>

        <!-- 출석 관리 -->
        <div class="tab-content" id="attendanceTab">
            <div class="att-admin">
                <!-- 주차·조 선택 -->
                <div class="att-pickers">
                    <label class="att-picker">
                        <span class="att-picker-label">주차</span>
                        <select id="attSessionPicker" class="att-select"></select>
                    </label>
                    <label class="att-picker">
                        <span class="att-picker-label">조</span>
                        <select id="attTeamPicker" class="att-select"></select>
                    </label>
                </div>

                <div class="att-session-row">
                    <div class="att-session-info" id="attSessionInfo"></div>
                    <div class="att-freshness">
                        <span id="attLoadedAt" class="att-loaded-at"></span>
                        <button type="button" id="attReloadBtn2" class="att-mini-btn">↻ 다시 읽기</button>
                    </div>
                </div>

                <!-- 편집 중 배경 갱신이 도착하면 여기에 알린다 (덮지 않는다) -->
                <div class="att-stale" id="attStaleNotice" style="display: none;">
                    <span>⚠️ 새 출결 데이터가 도착했습니다. 지금 저장하면 화면에 보이는 값 기준으로 저장됩니다.</span>
                    <button type="button" id="attReloadBtn" class="att-stale-btn">새로 불러오기</button>
                </div>

                <!-- 일괄 버튼 -->
                <div class="att-bulk">
                    <button type="button" class="att-bulk-btn" id="attAllPresentBtn">전체 출석</button>
                    <button type="button" class="att-bulk-btn" id="attBlankAbsentBtn">빈칸 → 결석</button>
                    <button type="button" class="att-bulk-btn danger" id="attClearBtn">전체 지우기</button>
                    <button type="button" class="att-bulk-btn" id="attRevertBtn">마지막 저장 상태로</button>
                </div>

                <div class="att-summary" id="attSummary"></div>

                <div class="att-legend">
                    <span><b>O</b> 출석</span><span><b>X</b> 결석</span><span><b>·</b> 미기록</span>
                    <span class="att-legend-lock">🔒 ◎ − 돌봄 등은 시트에서 직접 수정</span>
                </div>

                <div class="att-list" id="attList"></div>

                <!-- 저장 바 -->
                <div class="att-save-bar" id="attSaveBar">
                    <span class="att-save-info" id="attSaveInfo">변경 사항 없음</span>
                    <button type="button" class="att-save-btn" id="attSaveBtn" disabled>저장</button>
                </div>
            </div>
        </div>

        <!-- 결석 현황 -->
        <div class="tab-content" id="absenceTab">
            <div class="ab-controls">
                <label class="att-picker">
                    <span class="att-picker-label">주차</span>
                    <select id="abSessionPicker" class="att-select"></select>
                </label>
                <label class="att-picker">
                    <span class="att-picker-label">정렬</span>
                    <select id="abSortPicker" class="att-select">
                        <option value="team">조 순서</option>
                        <option value="pastor">담당교역자</option>
                    </select>
                </label>
                <button type="button" id="abReloadBtn" class="att-mini-btn">↻ 다시 읽기</button>
                <span id="abLoadedAt" class="att-loaded-at"></span>
            </div>

            <!-- 이 주차 결석자 -->
            <section class="ab-block">
                <div class="ab-head">
                    <h3 class="ab-title">이 주차 결석자</h3>
                    <span class="ab-count" id="abWeekCount"></span>
                    <button type="button" id="abWeekCopyBtn" class="att-mini-btn">📋 명단 복사</button>
                </div>
                <!-- 아직 안 찍은 회차와 '전원 출석' 은 다른 이야기다. 구별해서 알린다. -->
                <div class="ab-note" id="abWeekNote"></div>
                <div class="ab-list" id="abWeekList"></div>
            </section>

            <!-- 누적 결석자 -->
            <section class="ab-block">
                <div class="ab-head">
                    <h3 class="ab-title">2회 이상 결석자</h3>
                    <span class="ab-count" id="abTotalCount"></span>
                    <div class="ab-thresholds" id="abThresholds">
                        <button type="button" class="att-bulk-btn on" data-min="2">2회 이상</button>
                        <button type="button" class="att-bulk-btn" data-min="3">3회 이상</button>
                        <button type="button" class="att-bulk-btn" data-min="4">4회 이상</button>
                    </div>
                    <button type="button" id="abTotalCopyBtn" class="att-mini-btn">📋 명단 복사</button>
                </div>
                <div class="ab-note" id="abTotalNote"></div>
                <div class="ab-list" id="abTotalList"></div>
            </section>
        </div>

        <!-- 출석부 출력 -->
        <div class="tab-content" id="printTab">
            <!-- 조가 13개면 미리보기가 13장이다. 조작부가 안 붙어 있으면
                 칸 하나 바꾸려고 매번 맨 위로 올라가야 한다. -->
            <div class="pr-controls">
                <div class="pr-row">
                    <label class="att-picker">
                        <span class="att-picker-label">주차</span>
                        <select id="prSessionPicker" class="att-select"></select>
                    </label>
                    <label class="att-picker">
                        <span class="att-picker-label">조·장소</span>
                        <select id="prScopePicker" class="att-select"></select>
                    </label>
                </div>

                <div class="pr-row pr-cols">
                    <span class="pr-cols-label">표시할 칸</span>
                    <label class="pr-chk"><input type="checkbox" id="prColLunch" checked> 김밥 현황</label>
                    <label class="pr-chk"><input type="checkbox" id="prColLunchReq"> 김밥신청</label>
                    <label class="pr-chk"><input type="checkbox" id="prColHw" checked> 과제</label>
                    <label class="pr-chk"><input type="checkbox" id="prColMemo" checked> 메모</label>
                    <label class="pr-chk"><input type="checkbox" id="prColSummary"> 조별 집계표</label>
                </div>

                <div class="pr-row">
                    <button type="button" id="prPrintBtn" class="sync-btn">🖨️ 인쇄</button>
                    <button type="button" id="prAllBtn" class="att-bulk-btn">전체 선택</button>
                    <button type="button" id="prNoneBtn" class="att-bulk-btn">전체 해제</button>
                    <button type="button" id="prPickToggleBtn" class="att-bulk-btn pr-pick-toggle"
                            aria-expanded="false" aria-controls="prPickList">▾ 부분 선택</button>
                    <span class="pr-count" id="prCount"></span>
                </div>

                <!-- 김밥·과제가 몇 명에게 붙었는지, 안 붙었으면 왜인지.
                     빈 칸만 보여 주면 아무도 원인을 알 수 없다. -->
                <div class="pr-data-info" id="prDataInfo"></div>

                <!-- 장 목록. 미리보기를 33장 넘기며 하나씩 끄는 대신 여기서 바로
                     고른다. 다만 조가 33개면 늘 펼쳐 두는 것만으로 화면을 먹는다 —
                     '부분 선택' 을 눌렀을 때만 연다. -->
                <div class="pr-picklist" id="prPickList" hidden></div>
            </div>

            <div class="pr-preview" id="prPreview"></div>
        </div>
    </div>

    <!-- 조원 목록 모달 -->
    <div class="team-modal" id="teamModal">
        <div class="team-modal-content">
            <div class="team-modal-header">
                <h2 id="teamModalTitle">조원 목록</h2>
                <button class="team-modal-close" id="teamModalClose">✕</button>
            </div>
            <div class="team-members-list" id="teamMembersList">
                <!-- 조원 카드들이 여기에 동적으로 생성됩니다 -->
            </div>
        </div>
    </div>

    <script type="module" src="admin.js?v=88"></script>
</body>
</html>
