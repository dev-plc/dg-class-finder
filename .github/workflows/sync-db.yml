name: 시트 → DB 동기화

on:
  workflow_dispatch:
    inputs:
      cohort:
        description: '대상 ID (비우면 시트의 표식을 따라감)'
        required: false
        default: ''
      start_year:
        description: '첫 회차의 연도 (비우면 올해). 학기가 11월 시작 1월 종료면 시작 연도를 적을 것'
        required: false
        default: ''
      dry_run:
        description: 'dry-run (쓰기 없이 확인만)'
        type: boolean
        required: false
        default: false
  schedule:
    # 2시간마다 (:20 UTC). Supabase 7일 pause 방지 겸용.
    #
    # 하루 한 번(12:00 KST)이었는데, 과제·김밥·명단은 **이 워크플로로만** DB 에
    # 들어온다 — GAS 의 10분 트리거는 출석만 민다. 그래서 낮 12시 이후에 낸
    # 과제는 다음 날 낮까지 앱에 안 보였다. 최대 24시간이다.
    #
    # 정각은 피한다. GitHub 의 예약 실행은 정각에 몰려서 30~45분씩 밀린다
    # (실제로 '0 3' 이 03:31~03:43 에 돌았다).
    - cron: '20 */2 * * *'

concurrency:
  group: sync-db
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 의존성 설치
        run: npm ci || npm install

      - name: 동기화 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GAS_API_URL: ${{ secrets.GAS_API_URL }}
          COHORT_ID: ${{ github.event.inputs.cohort }}
          START_YEAR: ${{ github.event.inputs.start_year }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          echo "flags:${FLAGS:-(없음)}"
          node scripts/sync-sheet-to-db.mjs $FLAGS
